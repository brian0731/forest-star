<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>森林告示板</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; background: #fff7e4; color: #425a40;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
      font-size: 16px; line-height: 1.7; overflow-wrap: anywhere; }
    main { max-width: 760px; margin: auto; }
    h2 { margin: 0 0 12px; color: #36553b; font-size: 1.3em; }
    p { margin: 0 0 12px; }
    ul { padding-left: 1.4em; }
    li { margin: 8px 0; }
    blockquote { margin: 16px 0; padding: 12px 16px; border-left: 4px solid #91a56c;
      border-radius: 8px; background: #e9eedb; }
    small { color: #7b785e; }
    img, video { max-width: 100%; height: auto; }
  </style>
</head>
<body>
  <main>
    <h2>今天，也一起守護森林！</h2>
    <p>歡迎回到森星小隊。點點開始頁的夥伴，看看牠們可愛的跳躍回應。</p>
    <ul>
      <li><strong>彈珠屋：</strong>讓彈珠掉進夥伴的籃子，收集成長分。</li>
      <li><strong>夥伴：</strong>培養森林好友，解鎖進化的驚喜。</li>
      <li><strong>守衛：</strong>編排四條隊伍，一起迎戰怪物。</li>
    </ul>
    <blockquote>第一次出發？按「新手教學」，可選中文、English 或粵語語音。</blockquote>
    <p><small>森林通訊 · 2026 年 11 月 4 日</small></p>
  </main>
</body>
</html>
