# Domain supplied by the user. Add HTTPS after DNS reaches this VPS.
server {
    listen 80;
    server_name star.singtu.hk;
    root /var/www/forest-star-updates;
    index index.html;
    autoindex off;

    # This read-only public service does not need long-term IP access logs.
    access_log off;

    location = /notice.html {
        try_files $uri =404;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Keep the former URL available for older development builds.
    location = /game/notice.html {
        try_files $uri =404;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /game/ {
        try_files $uri =404;
        default_type application/json;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /health.json {
        try_files $uri =404;
        default_type application/json;
        add_header Cache-Control no-store always;
    }

    # Publish each content version once, and retain prior versions for rollback.
    location /content/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
