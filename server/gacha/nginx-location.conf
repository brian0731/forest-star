# Add at http {} level (outside server {}), once:
# limit_req_zone $binary_remote_addr zone=forest_gacha:10m rate=3r/s;

# Add inside the EXISTING HTTPS server {} for star.singtu.hk.
location /api/gacha/ {
    limit_req zone=forest_gacha burst=20 nodelay;
    client_max_body_size 256k;
    proxy_pass http://127.0.0.1:8081/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
    proxy_send_timeout 30s;
    proxy_cache off;
    access_log off;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
}
